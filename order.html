<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>สั่งซื้อ | Body Scent</title>
  <meta name="description" content="กรอกข้อมูลเพื่อสั่งซื้อสินค้า Body Scent">
  <link rel="stylesheet" href="style.css">

  <style>
    .page-head h1 { line-height: 1.4; }
    .order-wrap { max-width: 640px; }
    .field textarea#items { min-height: 90px; }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a class="brand" href="index.html">Body Scent</a>
      <nav aria-label="เมนูหลัก">
        <ul class="nav">
          <li><a href="index.html">หน้าแรก</a></li>
          <li><a href="product.html">สินค้า</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container order-wrap">
        <div class="section-head page-head">
          <h1>สั่งซื้อสินค้า</h1>
          <span class="rule" aria-hidden="true"></span>
          <p class="lead">กรอกข้อมูลด้านล่างเพื่อยืนยันคำสั่งซื้อ</p>
        </div>

        <form id="orderForm" class="panel">

          <div class="field">
            <label for="customerName">ชื่อลูกค้า</label>
            <input type="text" id="customerName" name="customerName" autocomplete="name" required>
          </div>

          <div class="field">
            <label for="contact">เบอร์โทร / Line</label>
            <input type="text" id="contact" name="contact" placeholder="เช่น 081-234-5678 หรือ Line ID" required>
          </div>

          <div class="field">
            <label for="items">รายการสินค้า</label>
            <textarea id="items" name="items" rows="3" required></textarea>
            <span class="caption">ยังไม่ได้เลือกสินค้า? <a class="link-line" href="product.html">ดูสินค้าทั้งหมด</a></span>
          </div>

          <div class="field">
            <label for="total">จำนวนเงินรวม (บาท)</label>
            <input type="number" id="total" name="total" min="0" step="any" inputmode="decimal" required>
          </div>

          <div class="field">
            <label for="note">หมายเหตุ (ไม่บังคับ)</label>
            <textarea id="note" name="note" rows="3"></textarea>
          </div>

          <button type="submit" class="btn btn--solid btn--block">ยืนยันสั่งซื้อ</button>

          <p id="formMessage" class="form-message" role="status" aria-live="polite"></p>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <a class="brand" href="index.html">Body Scent</a>
      <p>© 2026 Body Scent สงวนลิขสิทธิ์</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
