<!DOCTYPE html>
<html lang="th">
<head>

  <title>ขอบคุณ | Body Scent</title>
  <link rel="stylesheet" href="style.css">

  <style>
    .thanks {
      display: flex;
      align-items: center;
      min-height: calc(100vh - 77px);
      min-height: calc(100svh - 77px);
      padding: var(--space-6) 0;
    }

    .thanks h1 { line-height: 1.4; }
    .thanks p { margin-left: auto; margin-right: auto; margin-bottom: var(--space-4); }

    @media (max-width: 720px) {
      .thanks {
        min-height: calc(100vh - 116px);
        min-height: calc(100svh - 116px);
        padding: var(--space-5) 0;
      }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a class="brand" href="index.html">Body Scent</a>
      <nav aria-label="เมนูหลัก">
        <ul class="nav">
          <li><a href="index.html">หน้าแรก</a></li>
          <li><a href="product.html">สินค้า</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="thanks">
      <div class="container text-center">
        <h1>ขอบคุณที่สั่งซื้อ</h1>
        <span class="rule" aria-hidden="true"></span>
        <p class="lead">เราได้รับคำสั่งซื้อของคุณเรียบร้อยแล้ว ขอบคุณที่ไว้วางใจ Body Scent</p>
        <a class="btn" href="index.html">กลับหน้าแรก</a>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <a class="brand" href="index.html">Body Scent</a>
      <p>© 2026 Body Scent สงวนลิขสิทธิ์</p>

</html>
